<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Faça o seu login e participe das aulas!</title>
    

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: Arial, sans-serif;

            /* imagem de fundo */
            background-image: url("https://blog.ifope.com.br/wp-content/uploads/2022/08/tecnicas-de-estudo-1080x675.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            width: 280px;
            color: white;
            text-align: center;
        }

        input {
            width: 100%;
            height: 35px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            padding: 5px;
        }

        input[type="submit"] {
            background: #00aaff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background: #0088cc;
        }
    </style>
</head>

<body>

    <form onsubmit="return Logar()">
        <h3>Login</h3>

        <input type="text" placeholder="Login" id="login">
        <input type="password" placeholder="Senha" id="senha">
        <input type="submit" value="Entrar">
    </form>

    <script>
        function Logar() {
            var login = document.getElementById("login").value;
            var senha = document.getElementById("senha").value;

            var letras = /^[A-Za-z]+$/;
            var numeros = /^[0-9]+$/;

            if (!letras.test(login)) {
                alert("O login deve conter apenas letras");
                return false;
            }

            if (!numeros.test(senha)) {
                alert("A senha deve conter apenas números");
                return false;
            }

            alert("Login válido!");
            window.location.href = "home.html";

            return false;
        }
    </script>

</body>
</html>
</body>

</html>
