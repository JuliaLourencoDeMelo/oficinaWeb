<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        form {
            width: 250px;
            margin: 200px auto;
        }

        input {
            display: block;
            margin: 10px auto;
            width: 100%;
        }
    </style>
</head>

<body>
    <form onsubmit="return Logar()">
        <h3>Login</h3>
        <input type="text" placeholder="Login" id="login">
        <input type="password" placeholder="Senha" id="senha">
        <p><a href="recuperar.html">Esqueceu a senha?</a></p>

        <input type="submit" value="Entrar">

    </form>

    <script>
        function Logar() {
            var login = document.getElementById("login").value;
        var senha = document.getElementById("senha").value;

        var letras = /^[A-Za-z]+$/;
        var numeros = /^[0-9]+$/;

        if (!letras.test(login)) {
            alert("O login deve conter apenas letras");
            return false;
        }

        if (!numeros.test(senha)) {
            alert("A senha deve conter apenas números");
            return false;
        }

        // Se chegou aqui, está tudo válido
        alert("Sucesso");
        window.location.href = "home.html";
        return false;
}
    </script>

</body>

</html>
